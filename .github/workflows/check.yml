# The gate on every pull request and every push to main: the same `bun run check` as locally (Biome, TypeScript,
# tests, Knip, the Varlock secret scan, generated files, next build) and a gitleaks scan of the history.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a newer push to a pull request replaces its run; runs on main and dispatched runs are never cancelled
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Bun's package cache and Playwright's browsers, kept between runs for as long as bun.lock is unchanged
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-playwright-${{ hashFiles('bun.lock') }}
          # after a dependency change, start from the last cache: most packages and the browser are still in it
          restore-keys: ${{ runner.os }}-bun-playwright-
      - run: bun install --frozen-lockfile
      # the logo check rasterises its fonts in Chromium (a cached browser is not downloaded again; its system libraries are)
      - run: bunx playwright install --with-deps chromium
      - run: bun run check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
